<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operaciones UKA</title>
<meta name="theme-color" content="#1B3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Operaciones UKA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #F3F5F9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #inicio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FFFFFF; transition: opacity .4s; z-index: 2; }
  #inicio img { width: 150px; height: 150px; border-radius: 32px; box-shadow: 0 8px 24px rgba(27, 58, 107, .18); }
  #inicio b { font-size: 26px; color: #1B3A6B; }
  #inicio span { font-size: 15px; color: #56627A; }
  #inicio i { width: 34px; height: 34px; border: 4px solid #DCE3EE; border-top-color: #1B3A6B; border-radius: 50%; animation: g 1s linear infinite; margin-top: 10px; }
  #inicio.listo { opacity: 0; pointer-events: none; }
  #sinred { display: none; position: fixed; left: 16px; right: 16px; bottom: 16px; background: #7A1D0B; color: #FFFFFF; padding: 12px 16px; border-radius: 12px; font-size: 15px; z-index: 3; text-align: center; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="inicio"><img src="icon-512.png" alt="Logo de Un Kilo de Ayuda"><b>Operaciones UKA</b><span>Un Kilo de Ayuda</span><i></i></div>
<div id="sinred">Sin conexión a internet. La plataforma se abrirá cuando vuelva la señal.</div>
<iframe id="app" title="Operaciones UKA" allow="camera; geolocation; clipboard-write; fullscreen"></iframe>
<script>
  // Enlace de la plataforma: el que termina en /exec (Implementar → Gestionar implementaciones).
  var PLATAFORMA = 'https://script.google.com/macros/s/AKfycbzdI9nOwtsqxSlJaBPxB1xpK63gOZiSey1UoEhf-L0Cz-TP28XDGeWyQtzNaIWDtnz0XA/exec';

  var marco = document.getElementById('app'), inicio = document.getElementById('inicio'), sinred = document.getElementById('sinred');
  var desde = Date.now();
  function abrir() {
    if (!navigator.onLine) { sinred.style.display = 'block'; return; }
    sinred.style.display = 'none';
    marco.src = PLATAFORMA;
  }
  marco.addEventListener('load', function () {
    if (!marco.src) return;
    setTimeout(function () { inicio.classList.add('listo'); }, Math.max(0, 900 - (Date.now() - desde)));
  });
  window.addEventListener('online', function () { if (!marco.src) abrir(); else sinred.style.display = 'none'; });
  window.addEventListener('offline', function () { sinred.style.display = 'block'; });
  abrir();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
</script>
</body>
</html>
