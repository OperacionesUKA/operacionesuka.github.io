<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operaciones UKA</title>
<meta name="theme-color" content="#1B3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Operaciones UKA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #F3F5F9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #inicio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FFFFFF; transition: opacity .4s; z-index: 2; }
  #inicio img.logo { width: 110px; height: 110px; border-radius: 32px; box-shadow: 0 8px 24px rgba(27, 58, 107, .18); }
  #inicio b { font-size: 26px; color: #1B3A6B; }
  #inicio span { font-size: 15px; color: #56627A; }
  #inicio .anim-caja { width: 375px; max-width: 92vw; height: 200px; display: flex; align-items: center; justify-content: center; }
  #inicio .anim { max-width: 100%; max-height: 200px; height: auto; transition: opacity .35s; }
  #inicio .anim.svg { width: 375px; }
  #inicio .anim.webp { width: 188px; }
  #inicio .anim.fuera { opacity: 0; }
  #inicio .estado { font-size: 14px; color: #1B3A6B; font-weight: 600; min-height: 18px; }
  #inicio .tip { max-width: 560px; margin: 0 20px; min-height: 140px; text-align: center; font-size: 25.5px; line-height: 1.3; color: #56627A; transition: opacity .35s; }
  #inicio .tip b { display: block; font-size: 25.5px; color: #1B3A6B; margin-bottom: 6px; }
  #inicio .tip span { display: block; font-size: 25.5px; line-height: 1.3; color: #56627A; }
  #inicio .tip.fuera { opacity: 0; }
  #inicio #directo { display: none; border: 1.5px solid #1B3A6B; background: #FFFFFF; color: #1B3A6B; border-radius: 10px; padding: 10px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  #inicio.listo { opacity: 0; pointer-events: none; }
  #sinred { display: none; position: fixed; left: 16px; right: 16px; bottom: 16px; background: #7A1D0B; color: #FFFFFF; padding: 12px 16px; border-radius: 12px; font-size: 15px; z-index: 3; text-align: center; }
  #avisoPush { display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; background: #1B3A6B; color: #FFFFFF; padding: 12px 14px; border-radius: 14px; z-index: 4; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); font-size: 15px; }
  #avisoPush .fila { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #avisoPush button { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
  #avisoPush .si { background: #FFFFFF; color: #1B3A6B; }
  #avisoPush .no { background: transparent; color: #FFFFFF; border: 1.5px solid #FFFFFF; }
</style>
</head>
<body>
<div id="inicio"><div class="anim-caja"><img id="animImg" class="anim svg" src="carga-40.svg" alt="Un Kilo de Ayuda, 40 años"></div><b>Operaciones UKA</b><span class="estado" id="estado">Conectando con la plataforma…</span><div class="tip" id="tip"><b>Tips</b><span id="tipTxt"></span></div><button id="directo" type="button">Abrir directo</button></div>
<div id="sinred"><span id="sinredT">Sin conexión a internet. La plataforma se abrirá cuando vuelva la señal.</span> <button id="usarOff" type="button" style="display:none;margin-left:8px;border:0;border-radius:8px;padding:6px 10px;font-weight:700;background:#FFFFFF;color:#7A1D0B;cursor:pointer">Abrir con lo guardado</button></div>
<div id="avisoPush"><b>¿Recibir avisos de Operaciones UKA?</b><br><span id="avisoPushT">Alertas importantes, tu agenda del día y salidas sin capturar, aunque la app esté cerrada.</span><div class="fila"><button class="si" id="pushSi">Activar avisos</button><button class="no" id="pushNo">Ahora no</button></div></div>
<iframe id="app" title="Operaciones UKA" allow="camera; geolocation; clipboard-write; fullscreen"></iframe>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="offline.js"></script>
<script>
  // Enlace de la plataforma: el que termina en /exec (Implementar → Gestionar implementaciones).
  var PLATAFORMA = 'https://script.google.com/macros/s/AKfycbzdI9nOwtsqxSlJaBPxB1xpK63gOZiSey1UoEhf-L0Cz-TP28XDGeWyQtzNaIWDtnz0XA/exec';

  var marco = document.getElementById('app'), inicio = document.getElementById('inicio'), sinred = document.getElementById('sinred');
  var desde = Date.now();
  // Sin conexión: si este equipo tiene respaldo, se abre la app con lo guardado.
  function sinConexion() {
    sinred.style.display = 'block';
    if (!window.ukaOffDisponible) return;
    ukaOffDisponible().then(function (o) {
      if (!o) return;
      document.getElementById('usarOff').style.display = 'inline-block';
      if (!marco.src) ukaOffAbrir();
    });
  }
  document.getElementById('usarOff').addEventListener('click', function () { if (window.ukaOffAbrir) ukaOffAbrir(); });
  function abrir() {
    if (!navigator.onLine) { sinConexion(); return; }
    sinred.style.display = 'none';
    marco.src = PLATAFORMA;
  }
  // La pantalla de inicio se queda hasta que la app avisa que ya está lista (o 25 s después de cargar, por si es una versión anterior).
  var lista = false;
  function quitarInicio() {
    if (lista) return;
    lista = true;
    setTimeout(function () { inicio.classList.add('listo'); clearInterval(rotar); }, Math.max(0, 1200 - (Date.now() - desde)));
  }
  marco.addEventListener('load', function () {
    if (!marco.src) return;
    document.getElementById('estado').textContent = 'Preparando tu información…';
    setTimeout(quitarInicio, 25000);
  });
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (host.slice(-22) !== '.googleusercontent.com' && host !== 'script.google.com') return;
    if (e.data && (e.data.uka === 'listo' || e.data.uka === 'hola' || e.data.uka === 'off-hola')) { quitarInicio(); if (!document.getElementById('offApp')) sinred.style.display = 'none'; }
  });

  // La carga inicial muestra la animación de los 40 años (las de la familia se usan dentro de la app) y tips de uso.
  var TIPS = [
    'En Propuesta de rutas, toca Analizar escenarios para ver opciones con cambios ligeros o desde cero.',
    'Las comunidades con 65 niños o más llevan 👥 2 grupos: atenderlas en dos grupos mejora la calidad.',
    'Lo ideal son 3 grupos por día; nunca más de 4 ni de 150 niños por brigada.',
    'Al reprogramar, la ⭐ indica que la ruta ya pasa cerca de esa comunidad.',
    '¿Reprogramaste por error? Abre la fecha nueva y toca Deshacer reprogramación.',
    'Activa los avisos en tu celular en Administración › Notificaciones.',
    'Al imprimir o guardar en PDF, elige las secciones o deja el acomodo recomendado.',
    'En la Captura del día, registra el peso de los niños NAR con Registrar peso.',
    'En el Tablero, las secciones se abren y se cierran: deja a la vista lo que más usas.',
    'Toma la ubicación de cada comunidad en campo: así los tiempos de ruta son más exactos.',
    'En el mapa de la visita ves el clima por hora de cada parada y los avisos de ciclones.',
    'Un cambio de día se avisa en persona a la comunidad en la visita anterior.',
    'El gerente autoriza las salidas del almacén por semana o la visita completa.',
    'El médico confirma los medicamentos que recibe y pide reposición desde su botiquín.',
    'En Seguimiento de embarazadas, la Hb se ajusta sola por la altitud de la comunidad.',
    'Descarga las bases NAR y de embarazadas en Excel para analizarlas.',
    '¿Dudas? En Administración › Manual de uso está la guía de tu puesto.'
  ];
  var tipEl = document.getElementById('tip'), tipTxt = document.getElementById('tipTxt');
  var ti = Math.floor(Math.random() / (1 / TIPS.length));
  tipTxt.textContent = TIPS[ti];
  var rotar = setInterval(function () {
    tipEl.classList.add('fuera');
    setTimeout(function () { ti = (ti + 1) % TIPS.length; tipTxt.textContent = TIPS[ti]; tipEl.classList.remove('fuera'); }, 350);
  }, 6500);

  // Si a los 3 s la plataforma no ha respondido (señal débil o sin datos) y el equipo tiene respaldo, se ofrece usar lo guardado.
  // Mientras tanto la plataforma sigue cargando; cuando termina, la app regresa sola a en línea.
  setTimeout(function () {
    if (lista || document.getElementById('offApp') || !window.ukaOffDisponible) return;
    ukaOffDisponible().then(function (o) {
      if (!o || lista || document.getElementById('offApp')) return;
      sinred.style.display = 'block';
      document.getElementById('sinredT').textContent = navigator.onLine ? 'La señal está lenta.' : 'Sin conexión a internet.';
      document.getElementById('usarOff').textContent = 'Usar sin conexión';
      document.getElementById('usarOff').style.display = 'inline-block';
    });
  }, 6000);

  // Si tarda más de 20 s, se ofrece abrir la plataforma directo.
  var directo = document.getElementById('directo');
  directo.addEventListener('click', function () { location.href = PLATAFORMA; });
  setTimeout(function () {
    if (lista) return;
    directo.style.display = 'block';
    // Hay "señal" pero la plataforma no carga (red muy débil): se ofrece usar lo guardado.
    if (window.ukaOffDisponible) ukaOffDisponible().then(function (o) { if (o && !lista) { sinred.style.display = 'block'; document.getElementById('sinredT').textContent = 'La plataforma no termina de cargar.'; document.getElementById('usarOff').style.display = 'inline-block'; } });
  }, 20000);
  // Mientras se usa lo guardado, cada 30 s se revisa si ya hay señal; si la hay, se vuelve a cargar la plataforma
  // y, cuando avisa que está lista, la app regresa sola a en línea.
  var probando = false;
  function recargarEnLinea() { probando = false; marco.src = PLATAFORMA + (PLATAFORMA.indexOf('?') > -1 ? '&' : '?') + 'r=' + Date.now(); }
  function sondear() {
    if (!document.getElementById('offApp') || probando || !navigator.onLine) return;
    probando = true;
    var listoYa = false;
    var t = setTimeout(function () { if (!listoYa) probando = false; }, 6000);
    fetch(PLATAFORMA, { mode: 'no-cors', cache: 'no-store' }).then(function () { listoYa = true; clearTimeout(t); recargarEnLinea(); }, function () { clearTimeout(t); probando = false; });
  }
  setInterval(sondear, 30000);
  window.addEventListener('online', function () {
    if (!marco.src) abrir();
    else if (document.getElementById('offApp')) setTimeout(sondear, 2000);
    else sinred.style.display = 'none';
  });
  window.addEventListener('offline', function () { if (!document.getElementById('offApp')) sinConexion(); });
  abrir();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });

  // ---------- Avisos en el celular (Firebase Cloud Messaging) ----------
  // La plataforma (dentro del marco) saluda al entrar; la portada pide el permiso, obtiene la clave del celular y se la regresa.
  var PUSH = { fuente: null, origen: '', mensajes: null };
  var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var instalada = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var avisoPush = document.getElementById('avisoPush');

  function pushListo() {
    return !!('serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window && window.firebase && window.UKA_FIREBASE &&
      String(UKA_FIREBASE.apiKey).indexOf('PEGA_AQUI') < 0);
  }
  function pushMensajes() {
    if (PUSH.mensajes) return PUSH.mensajes;
    if (!firebase.apps.length) firebase.initializeApp(UKA_FIREBASE);
    PUSH.mensajes = firebase.messaging();
    // Con la app abierta, Firebase no muestra el aviso solo: lo mostramos nosotros.
    PUSH.mensajes.onMessage(function (m) {
      var n = m.notification || {};
      navigator.serviceWorker.ready.then(function (reg) { reg.showNotification(n.title || 'Operaciones UKA', { body: n.body || '', icon: 'icon-192.png', badge: 'icon-192.png', tag: (m.data && m.data.clave) || 'uka', data: { liga: './' } }); });
    });
    return PUSH.mensajes;
  }
  function aPlataforma(msg) { if (PUSH.fuente) { try { PUSH.fuente.postMessage(msg, PUSH.origen); } catch (e) { } } }
  function equipoNombre() {
    var ua = navigator.userAgent;
    return (esIOS ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Equipo') + (instalada ? ' · app' : ' · navegador');
  }
  function estadoPush() {
    var ok = pushListo();
    return { uka: 'shell', soporta: ok, ios: esIOS, instalada: instalada, permiso: ('Notification' in window) ? Notification.permission : 'no',
      motivo: ok ? '' : (!window.UKA_FIREBASE || String(UKA_FIREBASE.apiKey).indexOf('PEGA_AQUI') > -1 ? 'Falta configurar Firebase en la portada.' : 'Este navegador no permite avisos.') };
  }
  function pushToken(nuevo) {
    navigator.serviceWorker.ready.then(function (reg) {
      return pushMensajes().getToken({ vapidKey: UKA_VAPID, serviceWorkerRegistration: reg });
    }).then(function (t) {
      if (t) aPlataforma({ uka: 'push-token', token: t, equipo: equipoNombre(), nuevo: !!nuevo });
    }).catch(function (e) { aPlataforma({ uka: 'push-error', texto: 'No se pudieron activar los avisos: ' + (e && e.message ? e.message : e), permiso: Notification.permission }); });
  }
  function pushPedir() {
    avisoPush.style.display = 'none';
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') pushToken(true);
      else aPlataforma({ uka: 'push-error', texto: p === 'denied' ? 'Bloqueaste los avisos. Actívalos en los ajustes del celular.' : 'No se activaron los avisos.', permiso: p });
    });
  }
  function pospuesto() { try { return Number(localStorage.getItem('ukaPushNo') || 0) > Date.now(); } catch (e) { return false; } }
  document.getElementById('pushSi').addEventListener('click', pushPedir);
  document.getElementById('pushNo').addEventListener('click', function () {
    avisoPush.style.display = 'none';
    try { localStorage.setItem('ukaPushNo', String(Date.now() + 604800000)); } catch (e) { }
  });

  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (host.slice(-22) !== '.googleusercontent.com' && host !== 'script.google.com') return;
    var d = e.data || {};
    if (d.uka !== 'hola' && d.uka !== 'push-activar' && d.uka !== 'push-quitar') return;
    PUSH.fuente = e.source; PUSH.origen = e.origin;
    var est = estadoPush();
    if (d.uka === 'hola') {
      aPlataforma(est);
      if (!est.soporta) return;
      if (Notification.permission === 'granted') pushToken(false);
      else if (Notification.permission === 'default' && !pospuesto() && (!esIOS || instalada)) avisoPush.style.display = 'block';
    }
    if (d.uka === 'push-activar') {
      if (!est.soporta) { aPlataforma({ uka: 'push-error', texto: esIOS && !instalada ? 'En iPhone primero agrega la app a la pantalla de inicio.' : 'Este navegador no permite avisos.', permiso: est.permiso }); return; }
      if (Notification.permission === 'granted') { pushToken(true); return; }
      if (Notification.permission === 'denied') { aPlataforma({ uka: 'push-error', texto: 'Los avisos están bloqueados. Actívalos en los ajustes del celular.', permiso: 'denied' }); return; }
      // En Android el toque en la plataforma alcanza para pedir el permiso. En iPhone hay que tocar el botón de la portada.
      if (esIOS) avisoPush.style.display = 'block'; else pushPedir();
    }
    if (d.uka === 'push-quitar' && est.soporta) { try { pushMensajes().deleteToken(); } catch (x) { } }
  });

</script>
</body>
</html>
